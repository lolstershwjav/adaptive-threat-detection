[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-threat-detection"
version = "0.1.0"
description = "A prequential benchmark of unsupervised network anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "pandas==2.2.3",
]

[project.optional-dependencies]
report = ["matplotlib==3.10.8", "reportlab==4.4.9"]

[project.scripts]
adaptive-benchmark = "adaptive.benchmark:main"

[tool.setuptools.packages.find]
include = ["adaptive*"]
